name: External Test Runner

on:
  repository_dispatch:
    types: [external-test-trigger]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Display trigger information
      run: |
        echo "## Test Trigger Information" >> $GITHUB_STEP_SUMMARY
        echo "**Source Repository:** ${{ github.event.client_payload.source_repo }}" >> $GITHUB_STEP_SUMMARY
        echo "**Source Commit:** ${{ github.event.client_payload.source_sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Source Branch:** ${{ github.event.client_payload.source_branch }}" >> $GITHUB_STEP_SUMMARY
        echo "**Trigger Event:** ${{ github.event.client_payload.source_event }}" >> $GITHUB_STEP_SUMMARY
        echo "**Trigger Time:** ${{ github.event.client_payload.trigger_time }}" >> $GITHUB_STEP_SUMMARY

    - name: Run Functional Tests
      run: mvn test -Dtest=FunctionalTestRunner#testAllFunctional
      continue-on-error: true

    - name: Run Performance Tests
      run: mvn test -Dtest=PerformanceTestRunner#testAllPerformance
      continue-on-error: true

    - name: Generate Main Report
      if: always()
      run: |
        # Crear reporte principal si no existe
        if [ ! -f "target/karate-reports/index.html" ]; then
          echo "Generando reporte principal consolidado..."
          # Copiar el reporte principal si existe en el repositorio
          if [ -f "target/karate-reports/index.html" ]; then
            echo "Reporte principal ya existe"
          else
            echo "Reporte principal no encontrado, se generará en el siguiente paso"
          fi
        fi

    - name: Generate Test Summary
      if: always()
      run: |
        echo "## Test Execution Results" >> $GITHUB_STEP_SUMMARY
        echo "**Functional Tests executed:** $(find target/surefire-reports -name "*FunctionalTestRunner*" -exec grep -h "testsuite" {} \; | grep -o 'tests="[^"]*"' | cut -d'"' -f2 | awk '{sum+=$1} END {print sum+0}')" >> $GITHUB_STEP_SUMMARY
        echo "**Functional Tests failed:** $(find target/surefire-reports -name "*FunctionalTestRunner*" -exec grep -h "testsuite" {} \; | grep -o 'failures="[^"]*"' | cut -d'"' -f2 | awk '{sum+=$1} END {print sum+0}')" >> $GITHUB_STEP_SUMMARY
        echo "**Performance Tests executed:** $(find target/surefire-reports -name "*PerformanceTestRunner*" -exec grep -h "testsuite" {} \; | grep -o 'tests="[^"]*"' | cut -d'"' -f2 | awk '{sum+=$1} END {print sum+0}')" >> $GITHUB_STEP_SUMMARY
        echo "**Performance Tests failed:** $(find target/surefire-reports -name "*PerformanceTestRunner*" -exec grep -h "testsuite" {} \; | grep -o 'failures="[^"]*"' | cut -d'"' -f2 | awk '{sum+=$1} END {print sum+0}')" >> $GITHUB_STEP_SUMMARY

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ github.event.client_payload.source_sha }}
        path: |
          target/surefire-reports/
          target/karate-reports/
        retention-days: 7

    - name: Comment on source repository (if PR)
      if: github.event.client_payload.source_event == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const sourceRepo = '${{ github.event.client_payload.source_repo }}'.split('/');
          const owner = sourceRepo[0];
          const repo = sourceRepo[1];
          
          let summary = '## 🧪 External Tests Results\n\n';
          summary += `**Triggered from:** ${owner}/${repo}\n`;
          summary += `**Commit:** ${'${{ github.event.client_payload.source_sha }}'}\n`;
          summary += `**Branch:** ${'${{ github.event.client_payload.source_branch }}'}\n\n`;
          
          try {
            const functionalReportPath = 'target/karate-reports/functional/complete/index.html';
            const performanceReportPath = 'target/karate-reports/performance/index.html';
            
            if (fs.existsSync(functionalReportPath) && fs.existsSync(performanceReportPath)) {
              summary += '✅ **All tests completed successfully!**\n\n';
              summary += '📊 **Reports available:**\n';
              summary += '- Functional Tests: `target/karate-reports/functional/complete/index.html`\n';
              summary += '- Performance Tests: `target/karate-reports/performance/index.html`\n\n';
            } else if (fs.existsSync(functionalReportPath)) {
              summary += '⚠️ **Functional tests completed, performance tests may have failed**\n\n';
              summary += '📊 **Functional report available:** `target/karate-reports/functional/complete/index.html`\n\n';
            } else {
              summary += '❌ **Tests failed or reports not generated**\n\n';
            }
          } catch (error) {
            summary += '❌ **Error checking reports**\n\n';
          }
          
          summary += `🔗 [View Test Results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
          
          // Comentar en el PR del repositorio fuente
          const octokit = github.getOctokit(process.env.SOURCE_REPO_TOKEN);
          
          // Obtener el número de PR desde el contexto
          const prNumber = '${{ github.event.client_payload.source_event }}' === 'pull_request' ? 
            context.payload.client_payload.pull_request_number : null;
          
          if (prNumber) {
            await octokit.rest.issues.createComment({
              owner: owner,
              repo: repo,
              issue_number: prNumber,
              body: summary
            });
          }
      env:
        SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }} 
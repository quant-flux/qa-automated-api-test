name: External Development Tests

on:
  repository_dispatch:
    types: [full-api-commit-trigger]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Run Functional Tests
      run: mvn test -Dtest=FunctionalTestRunner#testCompleteReport
      continue-on-error: true

    - name: Run Performance Tests
      run: mvn test -Dtest=PerformanceTestRunner#testAllPerformance
      continue-on-error: true

    - name: Generate Test Summary
      if: always()
      run: |
        echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "**Functional Tests executed:** $(find target/surefire-reports -name "*FunctionalTestRunner*" -exec grep -h "testsuite" {} \; | grep -o 'tests="[^"]*"' | cut -d'"' -f2 | awk '{sum+=$1} END {print sum+0}')" >> $GITHUB_STEP_SUMMARY
        echo "**Functional Tests failed:** $(find target/surefire-reports -name "*FunctionalTestRunner*" -exec grep -h "testsuite" {} \; | grep -o 'failures="[^"]*"' | cut -d'"' -f2 | awk '{sum+=$1} END {print sum+0}')" >> $GITHUB_STEP_SUMMARY
        echo "**Performance Tests executed:** $(find target/surefire-reports -name "*PerformanceTestRunner*" -exec grep -h "testsuite" {} \; | grep -o 'tests="[^"]*"' | cut -d'"' -f2 | awk '{sum+=$1} END {print sum+0}')" >> $GITHUB_STEP_SUMMARY
        echo "**Performance Tests failed:** $(find target/surefire-reports -name "*PerformanceTestRunner*" -exec grep -h "testsuite" {} \; | grep -o 'failures="[^"]*"' | cut -d'"' -f2 | awk '{sum+=$1} END {print sum+0}')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📊 **Download the Karate HTML Reports from the Artifacts section below to view detailed results**" >> $GITHUB_STEP_SUMMARY

    - name: Generate Karate Summary JSON
      if: always()
      run: |
        echo "🚀 INICIANDO GENERACIÓN DE ARCHIVO DE RESUMEN..."
        echo "📁 Verificando directorio target/karate-reports/functional/complete..."
        mkdir -p target/karate-reports/functional/complete
        echo "Generando archivo de resumen de estadísticas..."
        
        # Calcular estadísticas funcionales
        FUNCTIONAL_TOTAL=$(find target/surefire-reports -name "*FunctionalTestRunner*" -exec grep -h "testsuite" {} \; | grep -o 'tests="[^"]*"' | cut -d'"' -f2 | awk '{sum+=$1} END {print sum+0}')
        FUNCTIONAL_FAILED=$(find target/surefire-reports -name "*FunctionalTestRunner*" -exec grep -h "testsuite" {} \; | grep -o 'failures="[^"]*"' | cut -d'"' -f2 | awk '{sum+=$1} END {print sum+0}')
        FUNCTIONAL_PASSED=$((FUNCTIONAL_TOTAL - FUNCTIONAL_FAILED))
        FUNCTIONAL_SUCCESS_RATE=$((FUNCTIONAL_TOTAL > 0 ? FUNCTIONAL_PASSED * 100 / FUNCTIONAL_TOTAL : 0))
        
        # Calcular estadísticas de performance
        PERFORMANCE_TOTAL=$(find target/surefire-reports -name "*PerformanceTestRunner*" -exec grep -h "testsuite" {} \; | grep -o 'tests="[^"]*"' | cut -d'"' -f2 | awk '{sum+=$1} END {print sum+0}')
        PERFORMANCE_FAILED=$(find target/surefire-reports -name "*PerformanceTestRunner*" -exec grep -h "testsuite" {} \; | grep -o 'failures="[^"]*"' | cut -d'"' -f2 | awk '{sum+=$1} END {print sum+0}')
        PERFORMANCE_PASSED=$((PERFORMANCE_TOTAL - PERFORMANCE_FAILED))
        PERFORMANCE_SUCCESS_RATE=$((PERFORMANCE_TOTAL > 0 ? PERFORMANCE_PASSED * 100 / PERFORMANCE_TOTAL : 0))
        
        # Crear archivo JSON con las estadísticas
        echo '{"functional":{"totalTests":'$FUNCTIONAL_TOTAL',"passedTests":'$FUNCTIONAL_PASSED',"failedTests":'$FUNCTIONAL_FAILED',"successRate":'$FUNCTIONAL_SUCCESS_RATE'},"performance":{"totalTests":'$PERFORMANCE_TOTAL',"passedTests":'$PERFORMANCE_PASSED',"failedTests":'$PERFORMANCE_FAILED',"successRate":'$PERFORMANCE_SUCCESS_RATE'}}' > target/karate-reports/functional/complete/karate-summary-json.txt
        
        echo "Archivo karate-summary-json.txt generado con estadísticas:"
        echo "Funcionales: $FUNCTIONAL_TOTAL total, $FUNCTIONAL_PASSED exitosos, $FUNCTIONAL_FAILED fallidos"
        echo "Performance: $PERFORMANCE_TOTAL total, $PERFORMANCE_PASSED exitosos, $PERFORMANCE_FAILED fallidos"
        
        # Verificar que el archivo se creó correctamente
        if [ -f "target/karate-reports/functional/complete/karate-summary-json.txt" ]; then
          echo "✅ Archivo karate-summary-json.txt creado exitosamente"
          echo "Contenido del archivo:"
          cat target/karate-reports/functional/complete/karate-summary-json.txt
        else
          echo "❌ Error: No se pudo crear el archivo karate-summary-json.txt"
        fi
        
        echo "🏁 FINALIZADA GENERACIÓN DE ARCHIVO DE RESUMEN"
        echo "📊 Resumen final:"
        echo "   - Archivo generado: target/karate-reports/functional/complete/karate-summary-json.txt"
        echo "   - Funcionales: $FUNCTIONAL_TOTAL total, $FUNCTIONAL_PASSED exitosos, $FUNCTIONAL_FAILED fallidos"
        echo "   - Performance: $PERFORMANCE_TOTAL total, $PERFORMANCE_PASSED exitosos, $PERFORMANCE_FAILED fallidos"

    - name: Upload Karate HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: karate-html-report
        path: target/karate-reports/
        retention-days: 30

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: target/surefire-reports/
        retention-days: 30

    - name: Verify Reports Generated
      if: always()
      run: |
        echo "🔍 Verificando si los reportes se generaron..."
        if [ -d "target/karate-reports" ]; then
          echo "✅ Directorio target/karate-reports existe"
          ls -la target/karate-reports/
          
          if [ -f "target/karate-reports/index.html" ]; then
            echo "✅ index.html encontrado en target/karate-reports/"
            echo "📄 Tamaño: $(wc -c < target/karate-reports/index.html) bytes"
          else
            echo "❌ index.html NO encontrado en target/karate-reports/"
          fi
          
          # Verificar reportes funcionales
          if [ -d "target/karate-reports/functional" ]; then
            echo "✅ Directorio functional existe"
            ls -la target/karate-reports/functional/
            
            if [ -d "target/karate-reports/functional/complete" ]; then
              echo "✅ Directorio functional/complete existe"
              ls -la target/karate-reports/functional/complete/
              
              if [ -f "target/karate-reports/functional/complete/index.html" ]; then
                echo "✅ functional/complete/index.html encontrado"
                echo "📄 Tamaño: $(wc -c < target/karate-reports/functional/complete/index.html) bytes"
              else
                echo "❌ functional/complete/index.html NO encontrado"
              fi
            else
              echo "❌ Directorio functional/complete NO existe"
            fi
          else
            echo "❌ Directorio functional NO existe"
          fi
          
          # Verificar reportes de performance
          if [ -d "target/karate-reports/performance" ]; then
            echo "✅ Directorio performance existe"
            ls -la target/karate-reports/performance/
            
            if [ -f "target/karate-reports/performance/index.html" ]; then
              echo "✅ performance/index.html encontrado"
              echo "📄 Tamaño: $(wc -c < target/karate-reports/performance/index.html) bytes"
            else
              echo "❌ performance/index.html NO encontrado"
            fi
            
            # Listar subdirectorios de performance
            echo "📁 Subdirectorios de performance:"
            find target/karate-reports/performance -type d -name "*" | head -10
            
            # Listar archivos HTML en performance
            echo "📄 Archivos HTML en performance:"
            find target/karate-reports/performance -name "*.html" | head -10
          else
            echo "❌ Directorio performance NO existe"
          fi
        else
          echo "❌ Directorio target/karate-reports NO existe"
        fi

  deploy:
    needs: test
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Download Karate Reports
      uses: actions/download-artifact@v4
      with:
        name: karate-html-report
        path: ./karate-reports
    
    - name: Setup Pages
      uses: actions/configure-pages@v5
    
    - name: Create index.html
      run: |
        mkdir -p public
        echo "🔍 Verificando contenido de karate-reports..."
        ls -la ./karate-reports/ || echo "❌ Directorio karate-reports no existe"
        
        if [ -d "./karate-reports" ]; then
          echo "📁 Copiando contenido de karate-reports a public..."
          cp -r ./karate-reports/* ./public/
          
          echo "🔍 Verificando contenido de public después de copiar..."
          ls -la ./public/
        fi
        
        # Siempre copiar los archivos actualizados desde recursos
        echo "📁 Copiando archivos actualizados desde recursos..."
        
        # Copiar el index.html principal desde recursos
        if [ -f "src/main/resources/index.html" ]; then
          cp src/main/resources/index.html ./public/index.html
          echo "✅ index.html principal copiado desde recursos"
        else
          echo "❌ index.html principal no encontrado en recursos, creando uno básico"
          echo "<html><body><h1>API Test Reports</h1><p>Reports available in subdirectories.</p><p><a href='functional/complete/index.html'>Functional Tests</a></p><p><a href='performance/index.html'>Performance Tests</a></p></body></html>" > ./public/index.html
        fi
        
        # Copiar index.html funcional desde recursos
        if [ -f "src/main/resources/functional/complete/index.html" ]; then
          mkdir -p ./public/functional/complete
          cp src/main/resources/functional/complete/index.html ./public/functional/complete/index.html
          echo "✅ functional/complete/index.html copiado desde recursos"
        else
          echo "❌ functional/complete/index.html no encontrado en recursos"
        fi
        
        # Copiar archivo de estadísticas si existe
        if [ -f "karate-reports/functional/complete/karate-summary-json.txt" ]; then
          cp karate-reports/functional/complete/karate-summary-json.txt ./public/functional/complete/karate-summary-json.txt
          echo "✅ karate-summary-json.txt copiado al directorio público"
        elif [ -f "src/main/resources/functional/complete/karate-summary-json.txt" ]; then
          cp src/main/resources/functional/complete/karate-summary-json.txt ./public/functional/complete/karate-summary-json.txt
          echo "✅ karate-summary-json.txt copiado desde recursos (archivo de prueba)"
        else
          echo "❌ karate-summary-json.txt no encontrado, creando uno con valores por defecto"
          echo '{"functional":{"totalTests":0,"passedTests":0,"failedTests":0,"successRate":0},"performance":{"totalTests":0,"passedTests":0,"failedTests":0,"successRate":0}}' > ./public/functional/complete/karate-summary-json.txt
        fi
        
        # Verificar que el archivo se copió correctamente
        if [ -f "./public/functional/complete/karate-summary-json.txt" ]; then
          echo "✅ Archivo karate-summary-json.txt disponible en el directorio público"
          echo "Contenido del archivo en public:"
          cat ./public/functional/complete/karate-summary-json.txt
        else
          echo "❌ Error: No se pudo copiar el archivo al directorio público"
        fi
        
        # Copiar index.html de performance desde recursos
        if [ -f "src/main/resources/performance/index.html" ]; then
          mkdir -p ./public/performance
          cp src/main/resources/performance/index.html ./public/performance/index.html
          echo "✅ performance/index.html copiado desde recursos"
        else
          echo "❌ performance/index.html no encontrado en recursos"
        fi
        
        # Copiar archivo de estadísticas al directorio de performance también
        if [ -f "karate-reports/functional/complete/karate-summary-json.txt" ]; then
          cp karate-reports/functional/complete/karate-summary-json.txt ./public/performance/karate-summary-json.txt
          echo "✅ karate-summary-json.txt copiado al directorio de performance"
        elif [ -f "src/main/resources/functional/complete/karate-summary-json.txt" ]; then
          cp src/main/resources/functional/complete/karate-summary-json.txt ./public/performance/karate-summary-json.txt
          echo "✅ karate-summary-json.txt copiado desde recursos al directorio de performance"
        else
          echo "❌ karate-summary-json.txt no encontrado para performance, creando uno con valores por defecto"
          echo '{"functional":{"totalTests":0,"passedTests":0,"failedTests":0,"successRate":0},"performance":{"totalTests":0,"passedTests":0,"failedTests":0,"successRate":0}}' > ./public/performance/karate-summary-json.txt
        fi
        
        # Verificar que el archivo se copió correctamente en performance
        if [ -f "./public/performance/karate-summary-json.txt" ]; then
          echo "✅ Archivo karate-summary-json.txt disponible en el directorio de performance"
          echo "Contenido del archivo en performance:"
          cat ./public/performance/karate-summary-json.txt
        else
          echo "❌ Error: No se pudo copiar el archivo al directorio de performance"
        fi
        
        # Copiar directorio js desde recursos
        if [ -d "src/main/resources/js" ]; then
          mkdir -p ./public/js
          cp -r src/main/resources/js/* ./public/js/
          echo "✅ directorio js copiado desde recursos"
        else
          echo "❌ directorio js no encontrado en recursos"
        fi
    
    - name: Upload site
      uses: actions/upload-pages-artifact@v3
      with:
        path: './public'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

name: Performance Tests (Full-API Trigger)

on:
  repository_dispatch:
    types: [full-api-performance-trigger]

jobs:
  performance-test:
    name: "\U0001F680 Performance Tests (Full-API Trigger)"
    runs-on: ubuntu-latest
    steps:
      - name: Debug event
        run: echo "${{ toJson(github.event) }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: "\U0001F680 Run All Performance Tests"
        run: mvn -X test -Dtest=PerformanceTestRunner#testAllPerformance

      - name: Create Performance Reports Directory
        run: |
          mkdir -p reports/performance

      - name: Copy Performance Reports
        run: |
          cp -r target/karate-reports/performance/* reports/performance/ 2>/dev/null || true

      - name: "\U0001F4C1 Prepare reports directory"
        if: always()
        run: |
          mkdir -p docs/karate-reports/performance
          cp -r target/karate-reports/performance/* docs/karate-reports/performance/ || true

      - name: "\U0001F527 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: "\U0001F4E6 Install dependencies"
        run: npm install

      - name: "\U0001F504 Sync dashboards and Karate reports to docs"
        run: node scripts/sync-all-dashboards.js 
name: Deploy Functional Test Reports to GitHub Pages

on:
  push:
    branches: [ main, test-advanced-performance ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-functional-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Run Functional Tests
      run: mvn test -Dtest=FunctionalTestRunner -Dkarate.env=ci -Dkarate.options="--threads 4 --tags ~@slow"
      
    - name: Create Reports Directory Structure
      run: |
        echo "📁 Creando estructura de directorios para reportes..."
        mkdir -p reports/functional
        mkdir -p reports/performance
        echo "✅ Directorios creados"
        
    - name: Copy main index.html
      run: |
        echo "📄 Copiando index.html principal..."
        if [ -f "index.html" ]; then
          cp index.html reports/
          echo "✅ index.html copiado"
        else
          echo "⚠️ index.html no encontrado en la raíz, creando placeholder"
          echo '<!DOCTYPE html><html><head><title>QuantFlux Reports</title></head><body><h1>QuantFlux Test Reports</h1><p>Reports will be available here</p></body></html>' > reports/index.html
        fi
        
    - name: Copy Functional Reports
      run: |
        echo "📋 Copiando reportes funcionales..."
        if [ -d "target/karate-reports/functional/complete" ]; then
          cp -r target/karate-reports/functional/complete/* reports/functional/
          echo "✅ Reportes funcionales copiados desde complete/"
        elif [ -d "target/karate-reports/functional" ]; then
          cp -r target/karate-reports/functional/* reports/functional/
          echo "✅ Reportes funcionales copiados desde functional/"
        elif [ -d "target/karate-reports" ]; then
          find target/karate-reports -name "karate-summary.html" -exec cp {} reports/functional/ \;
          echo "✅ Reportes funcionales copiados desde karate-reports/"
        else
          echo "⚠️ No se encontraron reportes funcionales, creando placeholder"
          echo '<!DOCTYPE html><html><head><title>Functional Tests Report - QuantFlux</title><style>body{font-family:Arial,sans-serif;margin:40px}.header{background:#28a745;color:white;padding:20px;border-radius:8px}.content{margin-top:20px}</style></head><body><div class="header"><h1>🧪 Tests Funcionales - QuantFlux</h1><p>Reporte de tests funcionales de la API</p></div><div class="content"><h2>Estado: En ejecución</h2><p>Los tests funcionales se están ejecutando. Este reporte se actualizará automáticamente cuando se completen.</p><p><strong>Última actualización:</strong> '$(date)'</p></div></body></html>' > reports/functional/karate-summary.html
        fi
        
    - name: Copy Existing Performance Reports (if any)
      run: |
        echo "⚡ Copiando reportes de performance..."
        if [ -d "target/karate-reports/performance" ]; then
          cp -r target/karate-reports/performance/* reports/performance/ 2>/dev/null || true
          echo "✅ Reportes de performance copiados"
        else
          echo "⚠️ No se encontraron reportes de performance, creando placeholder"
          echo '<!DOCTYPE html><html><head><title>Performance Tests Report - QuantFlux</title><style>body{font-family:Arial,sans-serif;margin:40px}.header{background:#dc3545;color:white;padding:20px;border-radius:8px}.content{margin-top:20px}</style></head><body><div class="header"><h1>⚡ Tests de Performance - QuantFlux</h1><p>Reporte de tests de performance de la API</p></div><div class="content"><h2>Estado: Programado</h2><p>Los tests de performance se ejecutan bajo demanda o en horarios programados.</p><p><strong>Para ejecutar tests de performance:</strong></p><ul><li>Ve a GitHub Actions en el repositorio</li><li>Ejecuta el workflow "Performance Tests"</li><li>O espera a la ejecución programada</li></ul><p><strong>Última actualización:</strong> '$(date)'</p></div></body></html>' > reports/performance/karate-summary.html
        fi
        
    - name: Create Navigation Index
      run: |
        echo "📑 Creando índice de navegación..."
        echo '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reportes de Tests - QuantFlux</title><style>body{font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;margin:0;padding:20px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}.container{background:white;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.3);overflow:hidden;max-width:800px;width:100%}.header{background:linear-gradient(135deg,#28a745 0%,#20c997 100%);color:white;padding:40px;text-align:center}.header h1{margin:0;font-size:2.5em;font-weight:300}.header p{margin:10px 0 0 0;opacity:0.9}.content{padding:40px}.report-links{display:grid;grid-template-columns:1fr 1fr;gap:30px}.report-link{display:block;background:#f8f9fa;border:2px solid #e9ecef;border-radius:12px;padding:30px;text-decoration:none;color:#495057;transition:all 0.3s ease;text-align:center}.report-link:hover{transform:translateY(-5px);box-shadow:0 8px 25px rgba(0,0,0,0.15);border-color:#007bff;text-decoration:none;color:#495057}.functional-link{border-left:5px solid #28a745}.performance-link{border-left:5px solid #dc3545}.report-icon{font-size:3em;margin-bottom:15px;display:block}.report-title{font-size:1.3em;font-weight:600;margin-bottom:10px;color:#343a40}.report-description{color:#6c757d;font-size:0.9em;line-height:1.5}.status-badge{display:inline-block;padding:4px 8px;border-radius:12px;font-size:0.8em;font-weight:bold;margin-top:10px}.status-live{background:#d4edda;color:#155724}.status-scheduled{background:#fff3cd;color:#856404}@media (max-width:768px){.report-links{grid-template-columns:1fr}.header h1{font-size:2em}}</style></head><body><div class="container"><div class="header"><h1>🧪 Reportes de Tests</h1><p>QuantFlux - API de Tokens y Trading</p></div><div class="content"><div class="report-links"><a href="functional/karate-summary.html" class="report-link functional-link"><span class="report-icon">📋</span><div class="report-title">Tests Funcionales</div><div class="report-description">Reporte completo de tests funcionales con validaciones exhaustivas de endpoints</div><div class="status-badge status-live">✅ Ejecutado en cada commit</div></a><a href="performance/karate-summary.html" class="report-link performance-link"><span class="report-icon">⚡</span><div class="report-title">Tests de Performance</div><div class="report-description">Análisis de rendimiento y escalabilidad con métricas detalladas</div><div class="status-badge status-scheduled">🕐 Programado / Bajo demanda</div></a></div></div></div></body></html>' > reports/index.html
        echo "✅ Índice de navegación creado"
        
    - name: Verify Reports Directory
      run: |
        echo "🔍 Verificando directorio de reportes..."
        if [ -d "reports" ]; then
          echo "✅ Directorio reports existe"
          echo "📁 Contenido del directorio reports:"
          ls -la reports/
          echo "📁 Contenido de reports/functional:"
          ls -la reports/functional/ || echo "No existe reports/functional"
          echo "📁 Contenido de reports/performance:"
          ls -la reports/performance/ || echo "No existe reports/performance"
        else
          echo "❌ ERROR: Directorio reports no existe"
          exit 1
        fi
        
    - name: Upload reports as artifact
      uses: actions/upload-artifact@v4
      with:
        name: reports
        path: reports/
        retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-functional-test
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Download reports artifact
        uses: actions/download-artifact@v4
        with:
          name: reports
          path: reports
          
      - name: Verify downloaded reports
        run: |
          echo "🔍 Verificando artifact descargado..."
          if [ -d "reports" ]; then
            echo "✅ Directorio reports descargado correctamente"
            echo "📁 Contenido del directorio reports:"
            ls -la reports/
            echo "📁 Contenido de reports/functional:"
            ls -la reports/functional/ || echo "No existe reports/functional"
            echo "📁 Contenido de reports/performance:"
            ls -la reports/performance/ || echo "No existe reports/performance"
          else
            echo "❌ ERROR: Directorio reports no existe después de descargar"
            exit 1
          fi
          
      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 
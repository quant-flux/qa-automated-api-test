name: API Tests

on:
  push:
    branches: [main]
  pull_request:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Run Functional Tests
      run: mvn test -Dtest=FunctionalTestRunner#testAllFunctional
      continue-on-error: true

    - name: Run Performance Tests
      run: mvn test -Dtest=PerformanceTestRunner#testAllPerformance
      continue-on-error: true

    - name: Generate Test Summary
      if: always()
      run: |
        echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "**Functional Tests executed:** $(find target/surefire-reports -name "*FunctionalTestRunner*" -exec grep -h "testsuite" {} \; | grep -o 'tests="[^"]*"' | cut -d'"' -f2 | awk '{sum+=$1} END {print sum+0}')" >> $GITHUB_STEP_SUMMARY
        echo "**Functional Tests failed:** $(find target/surefire-reports -name "*FunctionalTestRunner*" -exec grep -h "testsuite" {} \; | grep -o 'failures="[^"]*"' | cut -d'"' -f2 | awk '{sum+=$1} END {print sum+0}')" >> $GITHUB_STEP_SUMMARY
        echo "**Performance Tests executed:** $(find target/surefire-reports -name "*PerformanceTestRunner*" -exec grep -h "testsuite" {} \; | grep -o 'tests="[^"]*"' | cut -d'"' -f2 | awk '{sum+=$1} END {print sum+0}')" >> $GITHUB_STEP_SUMMARY
        echo "**Performance Tests failed:** $(find target/surefire-reports -name "*PerformanceTestRunner*" -exec grep -h "testsuite" {} \; | grep -o 'failures="[^"]*"' | cut -d'"' -f2 | awk '{sum+=$1} END {print sum+0}')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📊 **Download the Karate HTML Reports from the Artifacts section below to view detailed results**" >> $GITHUB_STEP_SUMMARY

    - name: Upload Karate HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: karate-html-report
        path: target/karate-reports/
        retention-days: 30

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: target/surefire-reports/
        retention-days: 30

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          let summary = '## 🧪 API Tests Results\n\n';
          
          try {
            const functionalReportPath = 'target/karate-reports/functional/complete/index.html';
            const performanceReportPath = 'target/karate-reports/performance/index.html';
            
            if (fs.existsSync(functionalReportPath) && fs.existsSync(performanceReportPath)) {
              summary += '✅ **All tests completed successfully!**\n\n';
              summary += '📊 **Reports available:**\n';
              summary += '- Functional Tests: `target/karate-reports/functional/complete/index.html`\n';
              summary += '- Performance Tests: `target/karate-reports/performance/index.html`\n\n';
              summary += '🔗 [View Test Results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';
            } else if (fs.existsSync(functionalReportPath)) {
              summary += '⚠️ **Functional tests completed, performance tests may have failed**\n\n';
              summary += '📊 **Functional report available:** `target/karate-reports/functional/complete/index.html`\n\n';
              summary += '🔗 [View Test Results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';
            } else {
              summary += '❌ **Tests failed or reports not generated**\n\n';
              summary += '🔗 [View Test Results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';
            }
          } catch (error) {
            summary += '❌ **Error checking reports**\n\n';
            summary += '🔗 [View Test Results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Download Karate Reports
      uses: actions/download-artifact@v4
      with:
        name: karate-html-report
        path: ./karate-reports
    
    - name: Setup Pages
      uses: actions/configure-pages@v5
    
    - name: Create index.html
      run: |
        mkdir -p public
        if [ -d "./karate-reports" ]; then
          cp -r ./karate-reports/* ./public/
          # Asegurar que el index.html esté en la raíz
          if [ -f "./public/index.html" ]; then
            echo "✅ index.html encontrado en karate-reports"
          else
            echo "❌ index.html no encontrado, creando uno básico"
            echo "<html><body><h1>API Test Reports</h1><p>Reports available in subdirectories.</p><p><a href='functional/complete/index.html'>Functional Tests</a></p><p><a href='performance/index.html'>Performance Tests</a></p></body></html>" > ./public/index.html
          fi
        else
          echo "<html><body><h1>API Test Reports</h1><p>No test reports available at the moment.</p><p>Reports will appear here after successful test runs.</p></body></html>" > ./public/index.html
        fi
    
    - name: Upload site
      uses: actions/upload-pages-artifact@v3
      with:
        path: './public'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

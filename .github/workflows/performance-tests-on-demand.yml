name: Performance Tests - On Demand

on:
  workflow_dispatch:
    inputs:
      test_category:
        description: 'Categoría de test de performance'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - token-data
        - token-list
        - token-price
        - trade-list
        - global-load
      load_intensity:
        description: 'Intensidad de carga'
        required: true
        default: 'medium'
        type: choice
        options:
        - light
        - medium
        - heavy
        - stress
      duration_minutes:
        description: 'Duración del test en minutos'
        required: true
        default: '5'
        type: string
      concurrent_users:
        description: 'Número de usuarios concurrentes'
        required: true
        default: '50'
        type: string
      environment:
        description: 'Ambiente de testing'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
        - development

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  performance-test-on-demand:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Display Test Configuration
      run: |
        echo "🧪 Performance Test Configuration:"
        echo "Category: ${{ github.event.inputs.test_category }}"
        echo "Load Intensity: ${{ github.event.inputs.load_intensity }}"
        echo "Duration: ${{ github.event.inputs.duration_minutes }} minutes"
        echo "Concurrent Users: ${{ github.event.inputs.concurrent_users }}"
        echo "Environment: ${{ github.event.inputs.environment }}"
        echo "Triggered by: ${{ github.actor }}"
        echo "Execution Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
        
    - name: Run Performance Tests - All Categories
      if: github.event.inputs.test_category == 'all'
      run: mvn test -Dtest=PerformanceTestRunner#testAllPerformance
      
    - name: Run Performance Tests - Token Data
      if: github.event.inputs.test_category == 'token-data'
      run: mvn test -Dtest=PerformanceTestRunner#testTokenDataPerformance
      
    - name: Run Performance Tests - Token List
      if: github.event.inputs.test_category == 'token-list'
      run: mvn test -Dtest=PerformanceTestRunner#testTokenListPerformance
      
    - name: Run Performance Tests - Token Price
      if: github.event.inputs.test_category == 'token-price'
      run: mvn test -Dtest=PerformanceTestRunner#testTokenPricePerformance
      
    - name: Run Performance Tests - Trade List
      if: github.event.inputs.test_category == 'trade-list'
      run: mvn test -Dtest=PerformanceTestRunner#testTradeListPerformance
      
    - name: Run Performance Tests - Global Load
      if: github.event.inputs.test_category == 'global-load'
      run: mvn test -Dtest=PerformanceTestRunner#testGlobalPerformance
      
    - name: Create Performance Reports Directory
      run: |
        mkdir -p reports/performance
        
    - name: Copy Performance Reports
      run: |
        cp -r target/karate-reports/performance/* reports/performance/
        
    - name: Create Detailed Execution Summary
      run: |
        cat > reports/performance/on-demand-summary.md << EOF
        # On-Demand Performance Test Summary
        
        ## Execution Details
        - **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        - **Triggered by:** ${{ github.actor }}
        - **Test Category:** ${{ github.event.inputs.test_category }}
        - **Load Intensity:** ${{ github.event.inputs.load_intensity }}
        - **Duration:** ${{ github.event.inputs.duration_minutes }} minutes
        - **Concurrent Users:** ${{ github.event.inputs.concurrent_users }}
        - **Environment:** ${{ github.event.inputs.environment }}
        - **Branch:** ${{ github.ref_name }}
        - **Commit:** ${{ github.sha }}
        
        ## Test Configuration
        - **Category:** ${{ github.event.inputs.test_category }}
        - **Intensity:** ${{ github.event.inputs.load_intensity }}
        - **Duration:** ${{ github.event.inputs.duration_minutes }} minutes
        - **Users:** ${{ github.event.inputs.concurrent_users }}
        
        ## Results
        - **Total Tests:** $(find target/karate-reports/performance -name "*.json" | wc -l)
        - **Execution Time:** $(date -u +"%H:%M:%S")
        
        ## Reports
        - [Karate Summary](karate-summary.html)
        - [Karate Tags](karate-tags.html)
        - [Karate Timeline](karate-timeline.html)
        
        ## Performance Metrics
        Check the Karate reports for detailed performance metrics including:
        - Response times (min, max, average)
        - Throughput (requests/second)
        - Error rates
        - Percentiles (50th, 90th, 95th, 99th)
        
        ## Next Steps
        1. Review performance metrics
        2. Compare with baseline results
        3. Identify performance bottlenecks
        4. Update thresholds if necessary
        EOF
        
    - name: Upload Performance Reports as Artifact
      uses: actions/upload-artifact@v3
      with:
        name: on-demand-performance-${{ github.run_number }}-${{ github.event.inputs.test_category }}
        path: reports/performance/
        retention-days: 30
        
    - name: Create Performance Alert (if stress test)
      if: github.event.inputs.load_intensity == 'stress'
      run: |
        echo "🚨 STRESS TEST COMPLETED"
        echo "This was a high-intensity stress test with ${{ github.event.inputs.concurrent_users }} concurrent users"
        echo "Please review the results carefully for any performance issues"

  deploy-on-demand-reports:
    needs: performance-test-on-demand
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Download Performance Reports
      uses: actions/download-artifact@v3
      with:
        name: on-demand-performance-${{ github.run_number }}-${{ github.event.inputs.test_category }}
        path: reports/performance/
        
    - name: Deploy Updated Reports to GitHub Pages
      uses: actions/deploy-pages@v4
      with:
        path: reports 
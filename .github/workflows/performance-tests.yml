name: Performance Tests

on:
  schedule:
    # Ejecutar performance tests diariamente a las 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Permite ejecución manual
    inputs:
      test_type:
        description: 'Tipo de test de performance'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - baseline
        - load
        - stress
        - endurance
      environment:
        description: 'Ambiente de testing'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  performance-tests:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🔧 Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: 🚀 Run Baseline Performance Tests
      id: baseline-tests
      if: github.event.inputs.test_type == 'baseline' || github.event.inputs.test_type == 'all' || github.event_name == 'schedule'
      run: |
        echo "⚡ Ejecutando Baseline Performance Tests..."
        echo "Environment: ${{ github.event.inputs.environment || 'staging' }}"
        mvn test -Dtest=PerformanceTestRunner#testBaselinePerformance -q
        echo "✅ Baseline Performance Tests completados"

    - name: 🔥 Run Load Tests
      id: load-tests
      if: github.event.inputs.test_type == 'load' || github.event.inputs.test_type == 'all'
      run: |
        echo "🔥 Ejecutando Load Tests..."
        echo "Environment: ${{ github.event.inputs.environment || 'staging' }}"
        mvn test -Dtest=PerformanceTestRunner#testLoadPerformance -q
        echo "✅ Load Tests completados"

    - name: 💪 Run Stress Tests
      id: stress-tests
      if: github.event.inputs.test_type == 'stress' || github.event.inputs.test_type == 'all'
      run: |
        echo "💪 Ejecutando Stress Tests..."
        echo "Environment: ${{ github.event.inputs.environment || 'staging' }}"
        mvn test -Dtest=PerformanceTestRunner#testStressPerformance -q
        echo "✅ Stress Tests completados"

    - name: 🏃 Run Endurance Tests
      id: endurance-tests
      if: github.event.inputs.test_type == 'endurance' || github.event.inputs.test_type == 'all'
      run: |
        echo "🏃 Ejecutando Endurance Tests..."
        echo "Environment: ${{ github.event.inputs.environment || 'staging' }}"
        mvn test -Dtest=PerformanceTestRunner#testEndurancePerformance -q
        echo "✅ Endurance Tests completados"

    - name: 📊 Run All Performance Tests
      id: all-performance-tests
      if: github.event.inputs.test_type == 'all' || github.event_name == 'schedule'
      run: |
        echo "📊 Ejecutando Todos los Performance Tests..."
        echo "Environment: ${{ github.event.inputs.environment || 'staging' }}"
        mvn test -Dtest=PerformanceTestRunner#testAllPerformance -q
        echo "✅ Todos los Performance Tests completados"

    - name: 📈 Generate Performance Summary
      if: always()
      run: |
        echo "## ⚡ Performance Tests Summary" >> $GITHUB_STEP_SUMMARY
        
        # Calcular estadísticas de performance
        TOTAL_TESTS=$(find target/surefire-reports -name "*PerformanceTestRunner*" -exec grep -h "testsuite" {} \; | grep -o 'tests="[^"]*"' | cut -d'"' -f2 | awk '{sum+=$1} END {print sum+0}')
        FAILED_TESTS=$(find target/surefire-reports -name "*PerformanceTestRunner*" -exec grep -h "testsuite" {} \; | grep -o 'failures="[^"]*"' | cut -d'"' -f2 | awk '{sum+=$1} END {print sum+0}')
        PASSED_TESTS=$((TOTAL_TESTS - FAILED_TESTS))
        SUCCESS_RATE=$((TOTAL_TESTS > 0 ? PASSED_TESTS * 100 / TOTAL_TESTS : 0))
        
        echo "**Test Type:** ${{ github.event.inputs.test_type || 'scheduled' }}" >> $GITHUB_STEP_SUMMARY
        echo "**Environment:** ${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_STEP_SUMMARY
        echo "**Total Tests:** $TOTAL_TESTS" >> $GITHUB_STEP_SUMMARY
        echo "**Passed:** $PASSED_TESTS ✅" >> $GITHUB_STEP_SUMMARY
        echo "**Failed:** $FAILED_TESTS ❌" >> $GITHUB_STEP_SUMMARY
        echo "**Success Rate:** $SUCCESS_RATE%" >> $GITHUB_STEP_SUMMARY
        
        if [ $FAILED_TESTS -eq 0 ]; then
          echo "🎉 **All performance tests passed!**" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Some performance tests failed. Check the logs for details.**" >> $GITHUB_STEP_SUMMARY
        fi

    - name: 📁 Upload Performance Test Reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: performance-test-reports-${{ github.run_id }}
        path: |
          target/karate-reports/performance/
          target/surefire-reports/
        retention-days: 90

    - name: 🔗 Create Performance Test Report Links
      if: always()
      run: |
        echo "📊 **Performance Test Reports:**" >> $GITHUB_STEP_SUMMARY
        echo "- [Complete Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)" >> $GITHUB_STEP_SUMMARY
        echo "- [Karate HTML Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)" >> $GITHUB_STEP_SUMMARY

    - name: 📧 Performance Alert on Failure
      if: failure()
      run: |
        echo "🚨 **PERFORMANCE ALERT** 🚨" >> $GITHUB_STEP_SUMMARY
        echo "Performance tests failed in run ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
        echo "This may indicate performance degradation!" >> $GITHUB_STEP_SUMMARY
        echo "Check the logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

    - name: 📊 Performance Metrics Summary
      if: success()
      run: |
        echo "📈 **Performance Metrics:**" >> $GITHUB_STEP_SUMMARY
        echo "✅ Performance tests completed successfully" >> $GITHUB_STEP_SUMMARY
        echo "📊 Check the detailed performance metrics in the uploaded reports" >> $GITHUB_STEP_SUMMARY 
name: Performance Tests - Scheduled & On-Demand

on:
  # Ejecución programada: Lunes, Miércoles y Viernes a las 8:00 AM UTC
  schedule:
    - cron: '0 8 * * 1,3,5'
  
  # Ejecución bajo demanda
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Tipo de test de performance a ejecutar'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - baseline
        - load
        - stress
        - endurance
        - advanced
      environment:
        description: 'Ambiente de testing'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
        - development

  # Ejecución manual desde Issues
  issues:
    types: [opened, edited]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  performance-test:
    runs-on: ubuntu-latest
    
    # Solo ejecutar si es un issue con label "performance-test" o es programado/despachado
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'performance-test'))
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Set Test Type
      id: test-type
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "test_type=${{ github.event.inputs.test_type }}" >> $GITHUB_OUTPUT
        else
          echo "test_type=all" >> $GITHUB_OUTPUT
        fi
        
    - name: Set Environment
      id: environment
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
        else
          echo "environment=staging" >> $GITHUB_OUTPUT
        fi
        
    - name: Run Performance Tests - All
      if: steps.test-type.outputs.test_type == 'all'
      run: mvn test -Dtest=PerformanceTestRunner#testAllPerformance
      
    - name: Run Performance Tests - Baseline
      if: steps.test-type.outputs.test_type == 'baseline'
      run: mvn test -Dtest=PerformanceTestRunner#generateBaselinePerformanceReport
      
    - name: Run Performance Tests - Load
      if: steps.test-type.outputs.test_type == 'load'
      run: mvn test -Dtest=PerformanceTestRunner#generateLoadPerformanceReport
      
    - name: Run Performance Tests - Stress
      if: steps.test-type.outputs.test_type == 'stress'
      run: mvn test -Dtest=PerformanceTestRunner#generateStressPerformanceReport
      
    - name: Run Performance Tests - Endurance
      if: steps.test-type.outputs.test_type == 'endurance'
      run: mvn test -Dtest=PerformanceTestRunner#generateEndurancePerformanceReport
      
    - name: Run Performance Tests - Advanced
      if: steps.test-type.outputs.test_type == 'advanced'
      run: mvn test -Dtest=PerformanceTestRunner#generateAdvancedPerformanceReport
      
    - name: Create Performance Reports Directory
      run: |
        mkdir -p reports/performance
        
    - name: Copy Performance Reports
      run: |
        cp -r target/karate-reports/performance/* reports/performance/
        
    - name: Create Performance Summary
      run: |
        cat > reports/performance/execution-summary.md << EOF
        # Performance Test Execution Summary
        
        **Execution Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        **Trigger:** ${{ github.event_name }}
        **Test Type:** ${{ steps.test-type.outputs.test_type }}
        **Environment:** ${{ steps.environment.outputs.environment }}
        **Branch:** ${{ github.ref_name }}
        **Commit:** ${{ github.sha }}
        
        ## Test Results
        - **Total Tests:** $(find target/karate-reports/performance -name "*.json" | wc -l)
        - **Execution Time:** $(date -u +"%H:%M:%S")
        
        ## Reports Available
        - [Karate Summary](karate-summary.html)
        - [Karate Tags](karate-tags.html)
        - [Karate Timeline](karate-timeline.html)
        
        ## Next Scheduled Run
        - **Schedule:** Monday, Wednesday, Friday at 8:00 AM UTC
        - **Manual Trigger:** Available via workflow_dispatch
        - **Issue Trigger:** Create issue with label "performance-test"
        EOF
        
    - name: Upload Performance Reports as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: performance-reports-${{ github.run_number }}
        path: reports/performance/
        retention-days: 30
        
    - name: Comment on Issue (if triggered by issue)
      if: github.event_name == 'issues'
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## Performance Tests Completed ✅
            
            **Execution Details:**
            - **Test Type:** ${{ steps.test-type.outputs.test_type }}
            - **Environment:** ${{ steps.environment.outputs.environment }}
            - **Execution Time:** ${new Date().toISOString()}
            
            **Reports:**
            - [View Reports](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/performance/karate-summary.html)
            - [Download Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            **Next Steps:**
            - Review performance metrics
            - Check for any performance regressions
            - Update thresholds if necessary`
          })

  update-pages:
    needs: performance-test
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Download Performance Reports
      uses: actions/download-artifact@v4
      with:
        name: performance-reports-${{ github.run_number }}
        path: reports/performance/
        
    - name: Deploy Updated Reports to GitHub Pages
      uses: actions/deploy-pages@v4
      with:
        path: reports 
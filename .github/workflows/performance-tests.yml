name: Performance Tests

on:
  schedule:
    - cron: '0 8 * * 1,3,5'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Tipo de test de performance a ejecutar'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - baseline
        - load
        - stress
        - endurance
        - advanced
      environment:
        description: 'Ambiente de testing'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
        - development

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  performance-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 🐞 Debug - List performance feature and runner files
        run: |
          echo "Directorio de features de performance:"
          ls -l src/test/resources/features/performance/
          echo "Directorio de runners:"
          ls -l src/test/java/runners/
          echo "Comando Maven que se ejecutará según test_type:"
          echo "test_type: ${{ github.event.inputs.test_type }}"

      - name: 🐞 Debug - List Karate target directory
        run: |
          echo "Contenido de target/karate-reports/ antes de ejecutar los tests:"
          ls -l target/karate-reports/ || echo "No existe target/karate-reports/"

      - name: Run Performance Tests - All
        if: github.event.inputs.test_type == 'all' || github.event_name == 'schedule'
        run: mvn -X test -Dtest=PerformanceTestRunner#testAllPerformance

      - name: Run Performance Tests - Baseline
        if: github.event.inputs.test_type == 'baseline'
        run: mvn -X test -Dtest=PerformanceTestRunner#generateBaselinePerformanceReport

      - name: Run Performance Tests - Load
        if: github.event.inputs.test_type == 'load'
        run: mvn -X test -Dtest=PerformanceTestRunner#generateLoadPerformanceReport

      - name: Run Performance Tests - Stress
        if: github.event.inputs.test_type == 'stress'
        run: mvn -X test -Dtest=PerformanceTestRunner#generateStressPerformanceReport

      - name: Run Performance Tests - Endurance
        if: github.event.inputs.test_type == 'endurance'
        run: mvn -X test -Dtest=PerformanceTestRunner#generateEndurancePerformanceReport

      - name: Run Performance Tests - Advanced
        if: github.event.inputs.test_type == 'advanced'
        run: mvn -X test -Dtest=PerformanceTestRunner#generateAdvancedPerformanceReport

      - name: Create Performance Reports Directory
        run: |
          mkdir -p reports/performance

      - name: Copy Performance Reports
        run: |
          cp -r target/karate-reports/performance/* reports/performance/ 2>/dev/null || true

      - name: 📁 Prepare reports directory
        if: always()
        run: |
          mkdir -p docs/karate-reports/performance
          cp -r target/karate-reports/performance/* docs/karate-reports/performance/ || true

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔄 Sync dashboards and Karate reports to docs
        run: node scripts/sync-all-dashboards.js

      - name: Upload Performance Reports as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-reports
          path: reports/performance/
          retention-days: 30

      - name: 📁 Setup Pages
        if: success()
        uses: actions/configure-pages@v4

      - name: 📤 Upload artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: 🚀 Deploy to GitHub Pages
        if: success()
        uses: actions/deploy-pages@v4 
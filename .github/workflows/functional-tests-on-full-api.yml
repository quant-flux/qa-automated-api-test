name: Functional Tests (Full-API Trigger)

on:
  repository_dispatch:
    types: [full-api-functional-trigger]

jobs:
  functional-tests:
    name: "\U0001F9EA Functional Tests (Full-API Trigger)"
    runs-on: ubuntu-latest
    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\u2615 Set up Java 17"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: "\U0001F527 Cache Maven dependencies"
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: "\U0001F680 Run Complete Functional Tests"
        run: mvn -X test -Dtest=FunctionalTestRunner#testCompleteReport

      - name: "\U0001F4C1 Prepare reports directory"
        if: always()
        run: |
          mkdir -p docs/karate-reports/functional
          cp -r target/karate-reports/functional/* docs/karate-reports/functional/ || true

      - name: "\U0001F4C1 Upload Functional Test Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-reports
          path: |
            target/karate-reports/functional/
            target/surefire-reports/
          retention-days: 30 

      - name: "\U0001F527 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: "\U0001F4E6 Install dependencies"
        run: npm install

      - name: "\U0001F504 Sync dashboards and Karate reports to docs"
        run: node scripts/sync-all-dashboards.js 
name: Trigger External Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  trigger-external-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Trigger tests in external repository
      uses: actions/github-script@v7
      with:
        script: |
          // Configuración del repositorio externo donde se ejecutarán los tests
          const externalRepo = {
            owner: '${{ secrets.EXTERNAL_REPO_OWNER }}',
            repo: '${{ secrets.EXTERNAL_REPO_NAME }}'
          };
          
          // Información del commit actual
          const commitInfo = {
            sha: context.sha,
            branch: context.ref.replace('refs/heads/', ''),
            repository: context.repo.full_name,
            event: context.eventName
          };
          
          console.log(`🚀 Disparando tests en ${externalRepo.owner}/${externalRepo.repo}`);
          console.log(`📝 Commit: ${commitInfo.sha}`);
          console.log(`🌿 Rama: ${commitInfo.branch}`);
          
          try {
            // Disparar workflow en el repositorio externo
            await github.rest.repos.createDispatchEvent({
              owner: externalRepo.owner,
              repo: externalRepo.repo,
              event_type: 'external-test-trigger',
              client_payload: {
                source_repo: commitInfo.repository,
                source_sha: commitInfo.sha,
                source_branch: commitInfo.branch,
                source_event: commitInfo.event,
                trigger_time: new Date().toISOString()
              }
            });
            
            console.log('✅ Tests disparados exitosamente');
          } catch (error) {
            console.error('❌ Error disparando tests:', error.message);
            // No fallar el workflow si no se pueden disparar los tests
          }
      
      env:
        GITHUB_TOKEN: ${{ secrets.EXTERNAL_REPO_TOKEN }} 
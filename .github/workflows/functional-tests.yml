name: Functional Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  functional-tests:
    name: 🧪 Functional Tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 🐞 Debug - List feature and runner files
        run: |
          echo "Directorio de features funcionales:"
          ls -l src/test/resources/features/
          echo "Directorio de runners:"
          ls -l src/test/java/runners/
          echo "Comando Maven que se ejecutará: mvn -X test -Dtest=FunctionalTestRunner#testCompleteReport"

      - name: 🐞 Debug - List Karate target directory
        run: |
          echo "Contenido de target/karate-reports/ antes de ejecutar los tests:"
          ls -l target/karate-reports/ || echo "No existe target/karate-reports/"

      - name: 🚀 Run Complete Functional Tests
        run: mvn -X test -Dtest=FunctionalTestRunner#testCompleteReport

      - name: 📁 Prepare reports directory
        if: always()
        run: |
          mkdir -p docs/karate-reports/functional
          cp -r target/karate-reports/functional/* docs/karate-reports/functional/ || true

      - name: 📁 Upload Functional Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-reports
          path: |
            target/karate-reports/functional/
            target/surefire-reports/
          retention-days: 30 

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔄 Sync dashboards and Karate reports to docs
        run: node scripts/sync-all-dashboards.js

      - name: 📁 Setup Pages
        if: success()
        uses: actions/configure-pages@v4

      - name: 📤 Upload artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: 🚀 Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4 
<div id="features-grid" class="features-grid"></div>

<script>
fetch('target/karate-reports/functional/complete/features-list.json')
  .then(res => res.json())
  .then(features => {
    const grid = document.getElementById('features-grid');
    features.forEach(f => {
      const summary = f.summary
        ? `<div class="feature-summary">
              <span>Escenarios: <b>${f.summary.scenarios}</b></span>
              <span>✔️ ${f.summary.passed}</span>
              <span>❌ ${f.summary.failed}</span>
              <span>⏱️ ${(f.summary.durationMillis/1000).toFixed(1)}s</span>
           </div>`
        : '';
      const card = document.createElement('div');
      card.className = 'feature-card';
      card.innerHTML = `
        <h3>${f.name}</h3>
        ${summary}
        <a href="target/karate-reports/functional/complete/${f.file}" target="_blank" class="feature-link">
          Ver reporte
        </a>
      `;
      grid.appendChild(card);
    });
  });
</script>

<style>
.features-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 24px;
  margin: 40px 0;
}
.feature-card {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  padding: 24px 18px 18px 18px;
  text-align: center;
  transition: box-shadow 0.2s;
}
.feature-card:hover {
  box-shadow: 0 6px 24px rgba(0,0,0,0.12);
}
.feature-card h3 {
  margin-bottom: 10px;
  font-size: 1.2em;
}
.feature-summary {
  margin-bottom: 12px;
  font-size: 0.95em;
  color: #444;
  display: flex;
  justify-content: space-around;
  gap: 8px;
}
.feature-link {
  display: inline-block;
  margin-top: 8px;
  padding: 8px 18px;
  background: #667eea;
  color: #fff;
  border-radius: 6px;
  text-decoration: none;
  font-weight: 500;
  transition: background 0.2s;
}
.feature-link:hover {
  background: #4b5fc9;
}
</style>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantFlux - API Testing Project</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 800px;
            width: 100%;
        }
        .header {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 300;
        }
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
        }
        .content {
            padding: 40px;
        }
        .report-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .report-link {
            display: block;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 30px;
            text-decoration: none;
            color: #495057;
            transition: all 0.3s ease;
            text-align: center;
        }
        .report-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border-color: #007bff;
            text-decoration: none;
            color: #495057;
        }
        .functional-link {
            border-left: 5px solid #28a745;
        }
        .performance-link {
            border-left: 5px solid #dc3545;
        }
        .report-icon {
            font-size: 3em;
            margin-bottom: 15px;
            display: block;
        }
        .report-title {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 10px;
            color: #343a40;
        }
        .report-description {
            color: #6c757d;
            font-size: 0.9em;
            line-height: 1.5;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            margin-top: 10px;
        }
        .status-live {
            background: #d4edda;
            color: #155724;
        }
        .status-scheduled {
            background: #fff3cd;
            color: #856404;
        }
        @media (max-width: 768px) {
            .report-links {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 QuantFlux</h1>
            <p>API Testing Project - Tokens & Trading</p>
        </div>
        <div class="content">
            <div class="report-links">
                <a href="functional-report.html" class="report-link functional-link">
                    <span class="report-icon">📋</span>
                    <div class="report-title">Tests Funcionales</div>
                    <div class="report-description">
                        Reporte completo de tests funcionales con validaciones exhaustivas de endpoints
                    </div>
                    <div class="status-badge status-live">✅ Ejecutado en cada commit</div>
                </a>
                <a href="performance-report.html" class="report-link performance-link">
                    <span class="report-icon">⚡</span>
                    <div class="report-title">Tests de Performance</div>
                    <div class="report-description">
                        Análisis de rendimiento y escalabilidad con métricas detalladas
                    </div>
                    <div class="status-badge status-scheduled">🕐 Programado / Bajo demanda</div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
